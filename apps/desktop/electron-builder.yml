appId: com.studdybuddy.app
productName: StuddyBuddy
directories:
  output: release
files:
  - out/**
asar: true
mac:
  category: public.app-category.education
  target: [dmg, zip]
  # macOS requires a usage string + the audio-input entitlement to record.
  extendInfo:
    NSMicrophoneUsageDescription: >-
      StuddyBuddy uses your microphone to record and transcribe your lectures.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
win:
  target: [nsis]
linux:
  target: [AppImage, deb]
  category: Education
